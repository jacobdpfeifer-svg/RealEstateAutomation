# Phase 1 geography: Texas — Harris + Dallas (research recommendation)
# Data-source priority ladder per county (bulk > API > portal_scrape)

[[county]]
fips = "48201"
name = "Harris"
state = "TX"
enabled = true
plaintiff = "HARRIS COUNTY"
plaintiff_terms = ["HARRIS COUNTY TAX ASSESSOR-COLLECTOR", "HARRIS COUNTY", "COUNTY OF HARRIS"]
# Case-insensitive substrings of source type (Harris toac/cs_typ, Dallas Case Type).
# Blank source types are kept; plaintiff matching remains the primary scope.
case_type_filter = ["Tax", "Delinquent", "OCV"]
ingest = ["bulk_dataset"]
tax_lookup = ["arcgis_rest"]
skip_trace = ["batchdata"]
clerk_adapter = "adapters.tx.harris_clerk.HarrisClerkAdapter"
tax_adapter = "adapters.tx.harris_tax.HarrisTaxAdapter"
clerk_bulk_url = "https://www.hcdistrictclerk.com/common/e-services/PublicDatasets.aspx"
arcgis_url = "https://www.gis.hctx.net/arcgis/rest/services/HCAD/Parcels/MapServer/0"
owner_field = "owner_name_1"
apn_field = "HCAD_NUM"
value_field = "total_market_val"
type_field = "parcel_type"

[[county]]
fips = "48113"
name = "Dallas"
state = "TX"
enabled = true
plaintiff = "DALLAS COUNTY"
plaintiff_terms = ["DALLAS COUNTY TAX", "DALLAS COUNTY", "COUNTY OF DALLAS"]
case_type_filter = ["Tax", "Delinquent"]
ingest = ["portal_scrape"]
tax_lookup = ["portal_scrape"]
skip_trace = ["batchdata"]
clerk_adapter = "adapters.tx.dallas_clerk.DallasClerkAdapter"
tax_adapter = "adapters.tx.dallas_tax.DallasTaxAdapter"
# Human landing page; adapter uses Tyler Odyssey Smart Search under DALLASPROD
clerk_portal_url = "https://courtsportal.dallascounty.org/DALLASPROD"
dcad_owner_url = "https://www.dallascad.org/searchowner.aspx"
dcad_detail_url = "https://www.dallascad.org/AcctDetailRes.aspx?ID={apn}"
# Official alternatives identified 2026-09-15 (not implemented as adapters yet):
# Civil index subscription: https://www.dallascounty.org/dcSubServicePaymentus/
# DCAD bulk appraisal data: https://www.dallascad.org/DataProducts.aspx
# Default clerk input is saved HTML; live portal access must be explicitly enabled.

# Phase 2 probe-only metros (enabled=false until adapters exist).
# Probe first: python3 scripts/bootstrap_county.py --county next

[[county]]
fips = "48439"
name = "Tarrant"
state = "TX"
enabled = false
plaintiff = "TARRANT COUNTY"
plaintiff_terms = ["TARRANT COUNTY TAX", "TARRANT COUNTY", "COUNTY OF TARRANT"]
case_type_filter = ["Tax", "Delinquent"]
ingest = ["portal_scrape"]
tax_lookup = ["arcgis_rest"]
skip_trace = ["batchdata"]
tax_adapter = "adapters.tx.tarrant_tax.TarrantTaxAdapter"
clerk_portal_url = "https://portal-txtarrant.tylertech.cloud/PublicAccess/default.aspx"
arcgis_url = "https://mapit.tarrantcounty.com/arcgis/rest/services/Dynamic/TADParcels/FeatureServer/0"
owner_field = "OWNER_NAME"
apn_field = "ACCOUNT"
value_field = "TOTAL_VALU"
type_field = "PARCELTYPE"
address_fields = ["SITUS_ADDR", "CITY", "ZIPCODE"]
# TAD property pages are JS-rendered; this is an account search deep-link, not a static parcel HTML page.
assessor_url_template = "https://www.tad.org/search-results?query={apn}"
situs_state = "TX"
# Live probe 2026-09-16: clerk is Tyler Odyssey PublicAccess (portal_scrape; no public bulk).
# Tax: queryable TAD ArcGIS REST (preferred). Probe's LAND_VALUE guess is land-only;
# TOTAL_VALU / PARCELTYPE sit past the probe's 40-field truncate. TAD also offers GIS
# shapefile zips at https://www.tad.org/resources/data-downloads — bulk GIS, not live owner search.
# Clerk adapter not registered: PublicAccess is County Clerk (probate/JP/CCL), not District Civil Tax.

[[county]]
fips = "48029"
name = "Bexar"
state = "TX"
enabled = false
plaintiff = "BEXAR COUNTY"
plaintiff_terms = ["BEXAR COUNTY TAX", "BEXAR COUNTY", "COUNTY OF BEXAR"]
case_type_filter = ["Tax", "Delinquent"]
ingest = ["portal_scrape"]
tax_lookup = ["arcgis_rest"]
skip_trace = ["batchdata"]
tax_adapter = "adapters.tx.bexar_tax.BexarTaxAdapter"
clerk_adapter = "adapters.tx.bexar_clerk.BexarClerkAdapter"
clerk_portal_url = "https://portal-txbexar.tylertech.cloud/Portal/"
odyssey_dashboard_path = "/Home/Dashboard/29"
odyssey_search_path = "/SmartSearch/SmartSearch/SmartSearch"
# Dashboard GET returned HTTP 405; warmup the portal root instead. recaptcha_required is
# landing-page evidence only — unverified on an actual submitted search.
odyssey_warmup_path = "/"
odyssey_recaptcha_required = false
arcgis_url = "https://maps.bexar.org/arcgis/rest/services/Parcels/MapServer/0"
owner_field = "Owner"
apn_field = "AcctNumb"
value_field = "TotVal"
type_field = "State_cd"
address_fields = ["Situs"]
assessor_url_template = "https://esearch.bcad.org/Property/?searchText={apn}"
situs_state = "TX"
# Live probe 2026-09-16: clerk is Tyler Odyssey Smart Search (portal_scrape; no bulk
# civil summaries). Tax: BCAD Parcels MapServer (Owner, AcctNumb, TotVal, State_cd).
# Probe guessed apn_field=PropID; AcctNumb is the BCAD account used for owner lookup.

[[county]]
fips = "04013"
name = "Maricopa"
state = "AZ"
enabled = false
# No county-plaintiff tax-suit ingest. Empty terms so plaintiff_is_tax_suit's COUNTY
# shortcut cannot swallow unrelated litigation. See artifacts/runtime/PHASE3_MARICOPA_MODEL.md.
plaintiff = ""
plaintiff_terms = []
case_type_filter = []
ingest = ["portal_scrape"]
tax_lookup = ["arcgis_rest"]
skip_trace = ["batchdata"]
tax_adapter = "adapters.az.maricopa_tax.MaricopaTaxAdapter"
clerk_portal_url = "https://www.superiorcourt.maricopa.gov/docket/civilcourtcases/casesearch.asp"
assessor_search_url = "https://mcassessor.maricopa.gov/search/property/"
arcgis_url = "https://gis.mcassessor.maricopa.gov/arcgis/rest/services/Parcels/MapServer/0"
owner_field = "OWNER_NAME"
apn_field = "APN"
value_field = "FCV_CUR"
address_fields = ["PHYSICAL_ADDRESS"]
assessor_url_template = "https://mcassessor.maricopa.gov/mcs/?q={apn}"
situs_state = "AZ"
# Live probe 2026-09-16: civil docket is HTML search (bulk needs AZ Rule 123 request).
# Assessor JSON search (/search/property/?q=) returned HTTP 500; ArcGIS parcels layer
# is live (OWNER_NAME, APN, FCV_CUR). Parcel layer has no delinquent/lien flag.
# Clerk tax-suit model does not apply: CP holders (not the county) file foreclosure
# actions; treasurer is typically a defendant. See artifacts/runtime/PHASE3_MARICOPA_MODEL.md.

